[[target]]
game_id = "pokemon-sapphire-us"
rom_sha1 = "4722efb8cd45772ca32555b98fd3b9719f8e60a9"

[[feature]]
id = "absolute-rtc"
name = "Absolute RTC"
description = "Use the host-seeded cartridge RTC directly for the in-game clock."
group = "Clock"
default_enabled = false

[[plugin]]
feature = "absolute-rtc"
id = "pokemon-rs.absolute-rtc"
